name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_akshare_smoke:
        description: "Run optional AKShare live smoke test"
        required: false
        default: "false"
      run_tiantian_smoke:
        description: "Run optional Tiantian live smoke test"
        required: false
        default: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile package
        run: python -m compileall -q fund_agent

  product-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Test frontend
        working-directory: web
        run: npm test -- --run

      - name: Build frontend
        working-directory: web
        run: npm run build

  akshare-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_akshare_smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AKShare
        run: python -m pip install akshare

      - name: Run optional AKShare smoke
        run: python -m fund_agent.cli smoke-akshare --watchlist-file configs/watchlist.yaml --portfolio-config configs/portfolio.yaml --output-dir outputs

  tiantian-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_tiantian_smoke == 'true'
    runs-on: ubuntu-latest
    env:
      TIANTIAN_API_BASE_URL: ${{ secrets.TIANTIAN_API_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tiantian base URL
        run: |
          if [ -z "$TIANTIAN_API_BASE_URL" ]; then
            echo "TIANTIAN_API_BASE_URL secret is not configured; skipping Tiantian smoke."
            exit 0
          fi

      - name: Run optional Tiantian smoke
        if: env.TIANTIAN_API_BASE_URL != ''
        run: python -m fund_agent.cli smoke-tiantian --code 510300 --output-dir outputs

      - name: Validate Tiantian smoke contracts
        if: env.TIANTIAN_API_BASE_URL != ''
        run: python -m fund_agent.cli validate-contract --output-dir outputs
