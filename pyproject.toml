[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ya-fundmind"
version = "0.16.0"
description = "YA FundMind local fund and ETF research assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["akshare"]
dev = ["pytest"]

[project.scripts]
fund-agent = "fund_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
