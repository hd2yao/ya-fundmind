[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-agent-os"
version = "0.1.0"
description = "Local fund and ETF research assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["akshare"]
dev = ["pytest"]

[project.scripts]
fund-agent = "fund_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
